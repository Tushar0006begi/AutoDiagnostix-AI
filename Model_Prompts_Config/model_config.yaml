# AutoDiagnostix-AI Model & Pipeline Configuration
# Optimized for Tata TechPulse & Applied AI Project Rubric

model_settings:
  primary_llm:
    provider: "Google"
    model_name: "gemini-1.5-pro"
    fallback_model: "gemini-1.5-flash"
    local_alternative: "meta-llama/Meta-Llama-3-8B-Instruct"
    temperature: 0.1
    top_p: 0.95
    max_output_tokens: 1500
    repetition_penalty: 1.05

embedding_settings:
  provider: "HuggingFace / OpenAI / Local"
  dense_model_name: "sentence-transformers/all-MiniLM-L6-v2"
  embedding_dimension: 384
  batch_size: 32
  normalize_embeddings: true

retrieval_settings:
  strategy: "Hybrid (BM25 Lexical + Dense Vector Cosine Similarity)"
  bm25_weight_alpha: 0.45
  dense_weight_beta: 0.55
  top_k_retrieved: 4
  similarity_threshold: 0.40
  reranking_enabled: true
  reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"

chunking_settings:
  splitter: "Recursive Section & Hierarchy Aware Splitter"
  chunk_size_tokens: 350
  chunk_overlap_tokens: 50
  metadata_fields:
    - "document_id"
    - "document_title"
    - "chapter"
    - "section"
    - "page_number"
    - "diagram_id"
    - "vehicle_models"

safety_guardrails:
  enforce_strict_citations: true
  require_safety_warning_on_hv: true
  hallucination_filter_threshold: 0.90
